<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Block Breaker</title><style>*{box-sizing:border-box}body{margin:0;background:#080d18;color:#eaf0ff;font:16px system-ui;display:grid;place-items:center;min-height:100vh}main{text-align:center;width:min(95vw,760px)}h1{color:#ff9c83;margin:0}p{color:#aab8d8}canvas{width:100%;background:#10112b;border:2px solid #563b80;border-radius:12px;max-height:65vh}button{background:#753ce1;color:white;border:0;border-radius:8px;padding:10px 18px;font-weight:bold}</style></head><body><main><h1>BLOCK BREAKER</h1><p>Move with ← → or mouse. Break every block!</p><canvas id="c" width="720" height="480"></canvas><p id="msg">Press Space or move the paddle to launch.</p><button onclick="reset()">Restart</button></main><script>
const c=document.querySelector('#c'),x=c.getContext('2d');let px=300,ball,bricks,score=0,run=false,done=false,keys={};function reset(){px=300;ball={x:360,y:420,vx:3,vy:-4,r:8};bricks=[];score=0;run=false;done=false;for(let r=0;r<5;r++)for(let col=0;col<10;col++)bricks.push({x:15+col*70,y:35+r*27,w:62,h:18,on:true,color:['#ff5c83','#ffb35c','#ffe66d','#63e6be','#6da8ff'][r]});document.querySelector('#msg').textContent='Press Space or move the paddle to launch.';draw()}function draw(){x.fillStyle='#10112b';x.fillRect(0,0,720,480);bricks.filter(b=>b.on).forEach(b=>{x.fillStyle=b.color;x.fillRect(b.x,b.y,b.w,b.h);x.fillStyle='#ffffff30';x.fillRect(b.x,b.y,b.w,3)});x.fillStyle='#b88cff';x.fillRect(px,450,120,12);x.fillStyle='#fff';x.beginPath();x.arc(ball.x,ball.y,ball.r,0,7);x.fill();x.fillStyle='#fff';x.font='bold 16px system-ui';x.fillText('Score: '+score,15,22)}function tick(){if(run&&!done){if(keys.ArrowLeft||keys.a)px-=7;if(keys.ArrowRight||keys.d)px+=7;px=Math.max(0,Math.min(600,px));ball.x+=ball.vx;ball.y+=ball.vy;if(ball.x<ball.r||ball.x>720-ball.r)ball.vx*=-1;if(ball.y<ball.r)ball.vy=Math.abs(ball.vy);if(ball.vy>0&&ball.y+ball.r>=450&&ball.x>=px&&ball.x<=px+120){ball.vy=-Math.abs(ball.vy);ball.vx=((ball.x-(px+60))/60)*5}for(const b of bricks){if(b.on&&ball.x>b.x&&ball.x<b.x+b.w&&ball.y-ball.r<b.y+b.h&&ball.y+ball.r>b.y){b.on=false;ball.vy*=-1;score+=10;break}}if(ball.y>490){run=false;document.querySelector('#msg').textContent='Ball missed! Press Restart.'}if(bricks.every(b=>!b.on)){done=true;run=false;document.querySelector('#msg').textContent='You cleared the board! Restart to play again.'}}draw();requestAnimationFrame(tick)}function launch(){if(!done&&ball.y<480)run=true;document.querySelector('#msg').textContent='Break the blocks!'}document.addEventListener('keydown',e=>{keys[e.key]=true;if(e.code==='Space'){e.preventDefault();launch()}});document.addEventListener('keyup',e=>keys[e.key]=false);c.addEventListener('mousemove',e=>{const r=c.getBoundingClientRect();px=(e.clientX-r.left)*720/r.width-60;px=Math.max(0,Math.min(600,px));launch()});c.addEventListener('touchmove',e=>{const r=c.getBoundingClientRect();px=(e.touches[0].clientX-r.left)*720/r.width-60;px=Math.max(0,Math.min(600,px));launch();e.preventDefault()},{passive:false});reset();tick();</script></body></html>
