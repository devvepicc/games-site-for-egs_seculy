<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory Match</title><style>*{box-sizing:border-box}body{margin:0;background:#080d18;color:#eaf0ff;font:16px system-ui;display:grid;place-items:center;min-height:100vh}main{text-align:center;width:min(95vw,600px)}h1{color:#c39bff;margin:0}p{color:#aab8d8}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px auto}.tile{height:clamp(65px,14vw,105px);background:linear-gradient(135deg,#6537bc,#243d87);border:1px solid #9b78e8;border-radius:12px;color:white;font-size:clamp(25px,6vw,40px);font-weight:bold}.tile.open,.tile.done{background:#13283a;border-color:#36d7a0}.tile.done{opacity:.5}button#reset{background:#753ce1;color:white;border:0;border-radius:8px;padding:10px 18px;font-weight:bold}</style></head><body><main><h1>MEMORY MATCH</h1><p>Find all matching pairs. Moves: <b id="moves">0</b> · Matches: <b id="matches">0</b>/8</p><div class="board" id="board"></div><p id="msg">Choose two cards to find a match.</p><button id="reset" onclick="start()">New Game</button></main><script>
const symbols=['★','◆','●','▲','☀','♫','✿','☂'];let first=null,lock=false,moves=0,matches=0;function start(){let a=[...symbols,...symbols].sort(()=>Math.random()-.5);first=null;lock=false;moves=matches=0;document.querySelector('#moves').textContent=0;document.querySelector('#matches').textContent=0;document.querySelector('#msg').textContent='Choose two cards to find a match.';document.querySelector('#board').innerHTML=a.map((s,i)=>`<button class="tile" data-i="${i}" data-s="${s}" aria-label="Hidden card">?</button>`).join('');document.querySelectorAll('.tile').forEach(b=>b.addEventListener('click',()=>flip(b)))}function flip(b){if(lock||b.classList.contains('open')||b.classList.contains('done'))return;b.classList.add('open');b.textContent=b.dataset.s;if(!first){first=b;return}moves++;document.querySelector('#moves').textContent=moves;if(first.dataset.s===b.dataset.s){first.classList.add('done');b.classList.add('done');first=null;matches++;document.querySelector('#matches').textContent=matches;if(matches===8)document.querySelector('#msg').textContent='You matched every pair! Great job.'}else{lock=true;let old=first;first=null;setTimeout(()=>{old.classList.remove('open');b.classList.remove('open');old.textContent=b.textContent='?';lock=false},700)}}start();</script></body></html>
