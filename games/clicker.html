<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Star Clicker</title><style>*{box-sizing:border-box}body{margin:0;background:#080d18;color:#eaf0ff;font:16px system-ui;display:grid;place-items:center;min-height:100vh;text-align:center}main{width:min(94vw,520px);padding:25px}h1{color:#8be7ff;margin:0}#score{font-size:52px;font-weight:900;margin:16px}#star{font-size:100px;background:radial-gradient(circle,#344d90,#171634);border:2px solid #596fc1;border-radius:50%;width:210px;height:210px;margin:10px auto;display:grid;place-items:center;cursor:pointer;user-select:none;transition:transform .08s}#star:active{transform:scale(.94)}button{background:#7339df;color:white;border:0;border-radius:8px;padding:10px 18px;font-weight:bold}p{color:#aab8d8}</style></head><body><main><h1>STAR CLICKER</h1><p>Click the star as many times as you can in 15 seconds!</p><div>Time: <b id="time">15</b>s</div><div id="score">0</div><div id="star" role="button" tabindex="0" aria-label="Click star">⭐</div><p id="msg">Press Start to begin.</p><button id="start" onclick="begin()">Start / Restart</button></main><script>
let score=0,time=15,active=false,timer;const s=document.querySelector('#star');function begin(){clearInterval(timer);score=0;time=15;active=true;document.querySelector('#score').textContent=score;document.querySelector('#time').textContent=time;document.querySelector('#msg').textContent='Go! Click the star!';timer=setInterval(()=>{time--;document.querySelector('#time').textContent=time;if(time<=0){active=false;clearInterval(timer);document.querySelector('#msg').textContent='Time up! You scored '+score+'. Start again to beat your record.'}},1000)}function hit(){if(!active)return;score++;document.querySelector('#score').textContent=score}s.addEventListener('click',hit);s.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();hit()}});</script></body></html>
