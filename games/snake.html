<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Snake</title><style>*{box-sizing:border-box}body{margin:0;background:#080d18;color:#eaf0ff;font:16px system-ui;display:grid;place-items:center;min-height:100vh}main{text-align:center;width:min(95vw,620px)}h1{color:#7cffbd;margin:0 0 4px}p{color:#aab8d8}canvas{width:min(90vw,480px);height:min(90vw,480px);max-height:60vh;background:#0b1720;border:2px solid #23674d;border-radius:12px;image-rendering:pixelated}.row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}button{background:#1d684a;color:white;border:0;border-radius:8px;padding:10px 16px;font-weight:bold}strong{color:#8dffbf}</style></head><body><main><h1>NEON SNAKE</h1><p>Score: <strong id="score">0</strong> · Use arrow keys or WASD</p><canvas id="c" width="480" height="480"></canvas><p id="msg">Press an arrow key to start.</p><div class="row"><button onclick="reset()">Restart</button><button onclick="pause()">Pause / Resume</button></div></main><script>
const c=document.querySelector('#c'),x=c.getContext('2d'),N=24,S=20;let snake,dir,food,score,timer,started,dead,paused;
function reset(){clearInterval(timer);snake=[{x:8,y:12},{x:7,y:12},{x:6,y:12}];dir={x:1,y:0};score=0;started=false;dead=false;paused=false;food={x:16,y:12};document.querySelector('#score').textContent=0;document.querySelector('#msg').textContent='Press an arrow key to start.';draw()}
function tick(){if(!started||dead||paused)return;let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(p=>p.x===h.x&&p.y===h.y)){dead=true;document.querySelector('#msg').textContent='Game over! Press Restart to try again.';return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score+=10;document.querySelector('#score').textContent=score;do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(p=>p.x===food.x&&p.y===food.y))}else snake.pop();draw()}
function draw(){x.fillStyle='#0b1720';x.fillRect(0,0,480,480);x.strokeStyle='#10262b';for(let i=0;i<=N;i++){x.beginPath();x.moveTo(i*S,0);x.lineTo(i*S,480);x.stroke();x.beginPath();x.moveTo(0,i*S);x.lineTo(480,i*S);x.stroke()}x.fillStyle='#ff669b';x.beginPath();x.arc(food.x*S+10,food.y*S+10,7,0,Math.PI*2);x.fill();snake.forEach((p,i)=>{x.fillStyle=i?'#23b879':'#8dffbd';x.fillRect(p.x*S+2,p.y*S+2,S-4,S-4)})}
function start(){if(!started&&!dead){started=true;document.querySelector('#msg').textContent='Eat the pink dots and avoid walls and yourself.';timer=setInterval(tick,115)}}
function pause(){if(dead)return;paused=!paused;document.querySelector('#msg').textContent=paused?'Paused':'Keep going!';if(!started&&!paused)start()}
document.addEventListener('keydown',e=>{let k=e.key.toLowerCase(),d={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[k];if(!d)return;e.preventDefault();if(d[0]!==-dir.x||d[1]!==-dir.y)dir={x:d[0],y:d[1]};start()});reset();</script></body></html>
