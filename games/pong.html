<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Pong</title><style>*{box-sizing:border-box}body{margin:0;background:#080d18;color:#eaf0ff;font:16px system-ui;display:grid;place-items:center;min-height:100vh}main{text-align:center;width:min(96vw,900px)}h1{color:#83c7ff;margin:0}p{color:#adbad8}canvas{width:100%;background:#080f24;border:2px solid #304b87;border-radius:12px;max-height:65vh}button{background:#2454a8;color:white;border:0;border-radius:8px;padding:10px 18px;font-weight:bold}</style></head><body><main><h1>NEON PONG</h1><p>Player 1: W / S · Player 2: ↑ / ↓ · First to 7 wins</p><canvas id="c" width="800" height="450"></canvas><p id="msg">Press Space to start or pause.</p><button onclick="reset()">Restart match</button></main><script>
const c=document.querySelector('#c'),ctx=c.getContext('2d');let p1,p2,b,score1,score2,run=false,winner='',keys={};function reset(){p1=190;p2=190;b={x:400,y:225,vx:5,vy:3};score1=score2=0;winner='';run=false;document.querySelector('#msg').textContent='Press Space to start.';draw()}function draw(){ctx.fillStyle='#080f24';ctx.fillRect(0,0,800,450);ctx.strokeStyle='#29406f';ctx.setLineDash([10,12]);ctx.beginPath();ctx.moveTo(400,0);ctx.lineTo(400,450);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#75baff';ctx.fillRect(24,p1,12,75);ctx.fillStyle='#c68bff';ctx.fillRect(764,p2,12,75);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,9,0,7);ctx.fill();ctx.font='bold 40px system-ui';ctx.fillText(score1,330,55);ctx.fillText(score2,450,55);if(winner){ctx.font='bold 28px system-ui';ctx.fillText(winner+' wins!',325,230)}}function tick(){if(run&&!winner){if(keys.w)p1-=6;if(keys.s)p1+=6;if(keys.ArrowUp)p2-=6;if(keys.ArrowDown)p2+=6;p1=Math.max(0,Math.min(375,p1));p2=Math.max(0,Math.min(375,p2));b.x+=b.vx;b.y+=b.vy;if(b.y<9||b.y>441)b.vy*=-1;if(b.x<36&&b.y>p1-5&&b.y<p1+80){b.vx=Math.abs(b.vx)*1.04;b.vy+=(b.y-(p1+37)/1)*.04}if(b.x>754&&b.y>p2-5&&b.y<p2+80){b.vx=-Math.abs(b.vx)*1.04;b.vy+=(b.y-(p2+37)/1)*.04}if(b.x<0){score2++;serve(-1)}if(b.x>800){score1++;serve(1)}if(score1>=7||score2>=7){winner=score1>=7?'Player 1':'Player 2';run=false;document.querySelector('#msg').textContent=winner+' wins! Restart for another match.'}}draw();requestAnimationFrame(tick)}function serve(dir){if(score1>=7||score2>=7)return;b={x:400,y:225,vx:5*dir,vy:(Math.random()*4-2)||2}}document.addEventListener('keydown',e=>{keys[e.key]=true;if(e.code==='Space'){e.preventDefault();run=!run;document.querySelector('#msg').textContent=run?'Game on!':'Paused';}});document.addEventListener('keyup',e=>keys[e.key]=false);reset();tick();</script></body></html>
